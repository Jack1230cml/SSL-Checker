<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSL Checker — host &amp; port TLS inspection</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>🔒 SSL Checker</h1>
      <p class="sub">Inspect the TLS certificate, cipher &amp; chain of any <code>host:port</code>.</p>
    </header>

    <form id="checkForm" class="search-card" autocomplete="off">
      <div class="field host">
        <label for="host">Host</label>
        <input id="host" name="host" type="text" placeholder="example.com" required
               spellcheck="false" autocapitalize="off" />
      </div>
      <div class="field port">
        <label for="port">Port</label>
        <input id="port" name="port" type="number" min="1" max="65535" value="443" />
      </div>
      <button id="checkBtn" type="submit" class="btn">Check</button>
    </form>

    <div id="status" class="status hidden"></div>
    <div id="results" class="results"></div>

    <footer class="foot">
      <span>Quick try: <a href="#" data-try="google.com:443">google.com</a> ·
        <a href="#" data-try="expired.badssl.com:443">expired.badssl.com</a> ·
        <a href="#" data-try="self-signed.badssl.com:443">self-signed.badssl.com</a> ·
        <a href="#" data-try="github.com:443">github.com</a></span>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
