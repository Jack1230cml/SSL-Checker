<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSL Checker — TLS · certificate · chain</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M8 11V7a4 4 0 0 1 8 0v4' fill='none' stroke='%234ade80' stroke-width='2' stroke-linecap='round'/><rect x='4' y='11' width='16' height='10' rx='2.5' fill='%234ade80'/></svg>" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2.5"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">SSL Checker</span>
          <span class="brand-sub">TLS · certificate · chain</span>
        </div>
      </div>
      <div class="topbar-note">inspect any host:port</div>
    </header>

    <main>
      <form id="checkForm" class="command" autocomplete="off" novalidate>
        <label class="field field-host">
          <span class="field-label">Host</span>
          <input id="host" name="host" type="text" placeholder="example.com" required spellcheck="false" autocapitalize="off" autocomplete="off" />
        </label>
        <label class="field field-port">
          <span class="field-label">Port</span>
          <input id="port" name="port" type="number" min="1" max="65535" value="443" inputmode="numeric" />
        </label>
        <button id="checkBtn" type="submit" class="btn">
          <span class="btn-label">Check</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="results" class="results"></div>
    </main>

    <footer class="foot">
      <span class="foot-label">Quick try</span>
      <a href="#" data-try="google.com:443">google.com</a>
      <a href="#" data-try="github.com:443">github.com</a>
      <a href="#" data-try="expired.badssl.com:443">expired</a>
      <a href="#" data-try="self-signed.badssl.com:443">self-signed</a>
    </footer>
  </div>

  <div id="challengeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="challengeTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <h3 id="challengeTitle" class="modal-title">Verification required</h3>
      <p class="modal-text">Too many requests from your IP. Solve this to continue:</p>
      <div id="challengeQuestion" class="challenge-question"></div>
      <input id="challengeAnswer" type="text" inputmode="numeric" placeholder="answer" autocomplete="off" spellcheck="false" />
      <div id="challengeError" class="challenge-error hidden"></div>
      <div class="modal-actions">
        <button id="challengeCancel" type="button" class="btn btn-ghost">Cancel</button>
        <button id="challengeSubmit" type="button" class="btn">Verify</button>
      </div>
    </div>
  </div>

  <script src="/main.js"></script>
</body>
</html>
